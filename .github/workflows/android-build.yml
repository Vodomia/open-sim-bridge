name: Build Android prototype

on:
  push:
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        run: gradle -p android-bridge :app:assembleDebug :media-bridge:assembleDebug

      - name: Upload control APK
        uses: actions/upload-artifact@v4
        with:
          name: open-sim-bridge-android-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload M5 media APK
        uses: actions/upload-artifact@v4
        with:
          name: open-sim-bridge-m5-media-debug
          path: android-bridge/media-bridge/build/outputs/apk/debug/media-bridge-debug.apk
          if-no-files-found: error
